<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Green Winter: An X-Files Fanfic Mystery</title>
<style>
  :root{
    --bg:#050705; --panel:#101410; --panel2:#0a0d0a;
    --bevel-hi:#5c6a5c; --bevel-lo:#000;
    --text:#ffffff; --dim:#a9b3a9; --sys:#8f998f;
    --green:#8cf28a; --red:#c8261a; --amber:#e0b34a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Courier New",Courier,"Lucida Console",monospace;font-size:17px;line-height:1.45}
  body{overflow:hidden}
  .crt{position:relative;height:100%;display:flex;flex-direction:column;
    background:radial-gradient(ellipse at center,#0b100b 0%,#050705 70%,#000 100%)}
  .crt::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  .crt::after{content:"";pointer-events:none;position:absolute;inset:0;z-index:6;
    box-shadow:inset 0 0 160px 40px rgba(0,0,0,.85)}
  @media (prefers-reduced-motion:no-preference){
    .crt{animation:flicker 7s infinite}
    @keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.93}99%{opacity:.98}}
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:10px 18px 8px;border-bottom:2px solid #000;box-shadow:0 2px 0 var(--bevel-hi);background:var(--panel2)}
  header h1{margin:0;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:30px;letter-spacing:.32em;
    text-shadow:0 0 6px rgba(200,38,26,.9),0 0 22px rgba(200,38,26,.45)}
  header h1 span{color:var(--green);text-shadow:0 0 8px var(--green)}
  header .sub{color:var(--dim);font-size:13px;letter-spacing:.08em}
  header .clock{font-size:14px;color:var(--dim);white-space:nowrap}
  main{flex:1;display:grid;grid-template-columns:1fr 300px;gap:10px;padding:10px;min-height:0}
  .bevel{background:var(--panel);border:2px solid;border-color:var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi)}
  .screen{display:flex;flex-direction:column;min-height:0}
  #log{position:relative;flex:1;overflow-y:auto;padding:16px 20px;scrollbar-width:thin;scrollbar-color:#3a453a #000}
  #log::after{content:"";display:block;height:85vh}
  #log p{margin:0 0 .85em;max-width:78ch;white-space:pre-wrap}
  #log p.room{color:var(--text)}
  #log p.title{font-weight:700;letter-spacing:.12em;margin-bottom:.4em;text-transform:uppercase}
  #log p.sys{color:var(--sys)}
  #log p.you{color:var(--green);margin-top:.4em}
  #log p.you::before{content:"> "}
  #log p.opt{color:var(--text);margin:0 0 .25em;cursor:pointer;padding-left:1.2em;text-indent:-1.2em}
  #log p.opt:hover{color:var(--green)}
  #log p.opt.off{color:#5c665c;cursor:default}
  #log p.cut{color:var(--dim);font-style:italic}
  #log p.exits{color:var(--sys);font-size:15px}
  #log b{color:#fff;font-weight:700}
  #log .q{color:#fff}
  #log p.end{color:var(--amber);font-weight:700;letter-spacing:.1em}
  .statusline{border-top:2px solid #000;box-shadow:0 -2px 0 var(--bevel-hi) inset;padding:6px 20px;background:#0d110d;color:var(--dim);font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .statusline b{color:#fff;font-weight:700;letter-spacing:.08em}
  .statusline .g{color:var(--green)}
  .prompt{display:flex;align-items:center;gap:8px;border-top:2px solid #000;box-shadow:0 -2px 0 var(--bevel-hi) inset;padding:10px 20px;background:var(--panel2)}
  .prompt .caret{color:var(--green)}
  .prompt input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:17px;caret-color:var(--green)}
  .prompt input:focus-visible{outline:1px dashed var(--green);outline-offset:4px}
  aside{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
  .box{padding:10px 12px}
  .box h2{margin:0 0 8px;font-size:13px;letter-spacing:.14em;color:var(--dim);font-weight:400}
  .verbs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button.v{font:inherit;font-size:14px;letter-spacing:.06em;color:#fff;background:#1c231c;padding:7px 6px;cursor:pointer;
    border:2px solid;border-color:var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi)}
  button.v:active{border-color:var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo)}
  button.v:focus-visible{outline:1px dashed var(--green);outline-offset:2px}
  button.v[disabled]{color:#5c665c;cursor:default}
  #inv{margin:0;padding:0;list-style:none;font-size:15px}
  #inv li{padding:2px 0}
  #inv li small{color:var(--dim)}
  #map{font-size:13px;line-height:1.5}
  #map .cl{margin-bottom:6px}
  #map .cl .n{color:#fff;letter-spacing:.06em}
  #map .cl .n.drive{cursor:pointer;text-decoration:underline dotted}
  #map .cl .n.drive:hover{color:var(--green)}
  #map .cl .n.here{color:var(--green)}
  #map .rooms{color:#6f7a6f;padding-left:10px}
  #map .rooms .here{color:#fff}
  #map .rooms .locked{color:#4a524a}
  #map.grey{opacity:.35}
  .status{font-size:14px;color:var(--dim);display:flex;justify-content:space-between}
  #rooted{display:block}
  #rooted .bar{display:flex;gap:4px;margin-top:6px}
  #rooted .bar i{flex:1;height:12px;border:1px solid #444;background:#000}
  #rooted .bar i.on{background:var(--red);box-shadow:0 0 8px var(--red)}
  #rooted .lbl{color:var(--red);letter-spacing:.14em;font-size:13px}
  #rooted .hint{color:#6f7a6f;font-size:12px}
  .restart-row{display:flex;gap:10px;margin:8px 20px 12px}.restart{display:none;flex:1}
  @media (max-width:820px){
    body{overflow:auto}
    main{grid-template-columns:1fr;grid-template-rows:60vh auto}
    header h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="crt">
  <header>
    <div><h1>THE GREEN <span>W</span>INTER</h1><div class="sub">An X-Files Fanfic Mystery</div></div>
    <div class="clock" id="clock"></div>
  </header>
  <main>
    <section class="screen bevel">
      <div id="log" aria-live="polite"></div>
      <div class="restart-row"><button class="v restart" id="restart">Play again</button><button class="v restart" id="crater">Back to the crater</button></div>
      <div class="statusline" id="statusline"></div>
      <div class="prompt"><span class="caret">&gt;</span><input id="in" autocomplete="off" spellcheck="false" placeholder="type a command, or pick a verb" aria-label="command"></div>
    </section>
    <aside>
      <div class="box bevel"><h2>Verbs</h2>
        <div class="verbs" id="verbs"></div></div>
      <div class="box bevel"><h2>Inventory</h2><ul id="inv"></ul></div>
      <div class="box bevel"><h2>Map</h2><div id="map"></div></div>
      <div class="box bevel status"><span id="seedstat"></span><span id="sig"></span></div>
      <div class="box bevel" id="rooted"><span class="lbl">Rooted</span> <span class="hint">— four and you sit down. Eating a seed helps.</span><div class="bar"><i></i><i></i><i></i><i></i></div></div>
    </aside>
  </main>
</div>

<script>
/* ===================== ENGINE ===================== */
const $=s=>document.querySelector(s);
const log=$('#log'), input=$('#in');
let queue=[], typing=false, skip=false, anchorY=null, checkpoint=null;
const fmt=s=>s.replace(/\{([A-Z ]+)\}/g,'<b>$1</b>');
function say(html,cls='room',onclick){queue.push({html:fmt(html),cls,onclick});pump();}
function sys(t){say(t,'sys')}
function cut(t){say(t,'cut')}
async function pump(){
  if(typing)return; typing=true;
  while(queue.length){
    const {html,cls,onclick}=queue.shift();
    const p=document.createElement('p');p.className=cls;p.innerHTML=html;
    if(onclick)p.addEventListener('click',onclick);
    const nodes=[];(function walk(n){for(const c of n.childNodes){if(c.nodeType===3){nodes.push([c,c.nodeValue]);c.nodeValue=''}else walk(c)}})(p);
    log.appendChild(p);
    if(cls==='you')anchorY=Math.max(0,p.offsetTop-14);
    if(anchorY!=null){log.scrollTop=anchorY;requestAnimationFrame(()=>{log.scrollTop=anchorY})}
    const fast=cls==='you'||cls==='opt'||skip||matchMedia('(prefers-reduced-motion: reduce)').matches;
    for(const [n,txt] of nodes){
      if(fast){n.nodeValue=txt;continue}
      for(let i=0;i<txt.length;i++){n.nodeValue+=txt[i];if(skip){n.nodeValue=txt;break}
        if(i%2===0)await new Promise(r=>setTimeout(r,7))}
    }
  }
  typing=false;skip=false;
}
log.addEventListener('click',()=>{skip=true});

/* ===================== STATE ===================== */
let S;
function fresh(){return{
  room:'room6', inv:[], ready:false, _closeRoom:{}, _left:{}, _notes:{}, seeds:20, turns:0, rooted:0, mode:'play', opts:[],
  act:1, closed:{main:false,clinic:false,edge:false,farm:false}, turned:false,
  f:{}, visits:{}, craterLooks:0, calls:{}, fight:{beat:0,right:0,light:false,proof:0,stood:[]}, ended:false
}}
const has=i=>S.inv.includes(i);
const give=i=>{if(!has(i))S.inv.push(i);ui()};
const drop=i=>{S.inv=S.inv.filter(x=>x!==i);ui()};

/* ===================== ITEMS ===================== */
const ITEMS={
  seeds:{n:'SUNFLOWER SEEDS',d:()=>`A crumpled pouch of sunflower seeds. ${S.seeds>1?'About '+S.seeds+' left.':'One left. You leave it.'} You eat them when you're thinking, which is always.`},
  crowbar:{n:'CROWBAR',d:()=>'Rusted, heavier than it looks. There is green on the hook end that didn\'t come from the gravel.'},
  soilkit:{n:'SOIL KIT',d:()=>'A county extension soil test kit. Vials, litmus strips, a laminated chart. Cal\'s initials on the case.'},
  solvent:{n:'SOLVENT',d:()=>'A brown bottle from Mrs. Ochieng. The label says PAINT STRIPPER in marker and then, smaller, "sorry."'},
  photograph:{n:'PHOTOGRAPH',d:()=>S.f.mural?'1934. A burning field. A man standing in the smoke, arms at his sides. Behind him, a second man hauling on a bell rope. You thought it was an alarm. Look at the sky in the picture: it\'s full of birds.':'1934. A burning field. A man standing in the smoke, arms at his sides. Behind him, a second man hauling on a rope. An alarm, you figure.'},
  keys:{n:'KEYS',d:()=>'Cal Rasmussen\'s truck keys on a county lanyard. He handed them over like he was passing the salt.'},
  rope:{n:'ROPE',d:()=>'The bell rope from the vestry, coiled. Older than the pastor. Older than the church, maybe.'},
  lighter:{n:'LIGHTER',d:()=>'A Zippo with a dent. Pastor Halvorsen said he doesn\'t need it anymore. He said it very kindly.'},
  salt:{n:'ROAD SALT',d:()=>'A forty-pound sack of public works road salt. The paper is damp at one corner.'},
  sample:{n:'POD',d:()=>'One pod in a freezer bag, gloved. It\'s warm through the plastic. You keep checking that it hasn\'t opened.'},
};
const ALIAS={seeds:'seeds',hands:'hands',sample:'sample','live pod':'sample','pod sample':'sample','soil kit':'soilkit',kit:'soilkit',photo:'photograph',picture:'photograph','road salt':'salt',pod:'sample','seed':'seeds','sunflower seeds':'seeds','key':'keys','truck keys':'keys'};
function itemId(w){w=w.toLowerCase().trim();if(ALIAS[w])return ALIAS[w];for(const k in ITEMS)if(k===w||ITEMS[k].n.toLowerCase()===w)return k;return null}

/* ===================== ROOMS ===================== */
const R={};
const CL={hub:'Motor Lodge',main:'Main Street',clinic:'Doc Amory\'s Clinic',edge:'Edge of Town',farm:'Halloran Farm'};
const ENTRY={hub:'parkinglot',main:'townhall',clinic:'waiting',edge:'greenhouse',farm:'farmhouse'};
const spokes=()=>Object.values(S.closed).filter(Boolean).length;

R.room6={name:'Room 6, Bellwether Motor Lodge',cl:'hub',items:['seeds'],
 d:()=>`A bed that's seen worse, a lamp that's seen nothing, and a laminated map of Bellwether on the wall you've already started sticking pins into. Your jacket's on the chair.${has('seeds')?'':' A pouch of {SUNFLOWER SEEDS} is on the bed where it fell out of the pocket, because there are always seeds in the pocket.'}${S.turned?'':' Scully\'s last text is still on your phone: DO NOT TOUCH ANYTHING.'}`,
 look:{map:()=>'Five places worth pinning: Main Street, the clinic, the edge of town, the Halloran farm, and this lot. Somebody has drawn a small circle around the farm in pencil. It wasn\'t you.',bed:'Made. You haven\'t used it. You\'re not going to.',phone:()=>'Bars: none. The motel is a hole. Something high up would help.',jacket:()=>has('seeds')?'Government issue. Seeds back in the pocket.':'Government issue. The pocket\'s empty. The seeds are on the bed.'},
 exits:{south:'parkinglot'}};
R.parkinglot={name:'Parking Lot',cl:'hub',car:true,
 d:()=>`Your rental sits under the one working light. A vending machine hums by the office door. It\'s out of everything except, somehow, sunflower seeds, and it never seems to run out of those. The night is very quiet and smells faintly of cut grass, though nobody\'s been cutting.`,
 look:{machine:()=>'Coils and coils of nothing, and one row of sunflower seeds at $1.25. It\'s full. It was full last time.',car:'The rental. It\'ll take you to any of the five places: Main Street, the clinic, the edge of town, the Halloran farm, or back here. GO [place].',light:'Moths.'},
 use:{machine:()=>{S.f.vend=(S.f.vend||0)+1;S.seeds+=12;const l=['You feed it a dollar and a quarter. The coil turns for a long, dramatic time. Sunflower seeds drop. Of course they do.','Another dollar twenty-five. Another pouch. The row behind it is full again. You don\'t look too closely.','It hums. You pay. Seeds.','It hums. You pay. Seeds.'];return l[Math.min(S.f.vend-1,3)]}},
 exits:{north:'room6',east:'office',south:'roadblock'}};
R.office={name:'Motel Office',cl:'hub',
 d:()=>`Wood paneling, a rack of brochures for things that closed in the eighties, ${here('denise')?'and Denise behind the counter with a crossword she isn\'t doing. ':'and nobody behind the counter. The crossword is on it, four across still blank.'}${!here('denise')?'':spokes()>=3?'She\'s looking at the window instead. She\'s smiling at it.':'She looks up like you\'re the best thing that\'s happened all week, which in Bellwether you might be.'}`,
 chars:['denise'],look:{brochures:'"VISIT THE BELLWETHER GRAIN ELEVATOR — TALLEST THING FOR 20 MILES."',crossword:'Four across: "Take root (6)." She hasn\'t filled it in.'},
 exits:{west:'parkinglot'}};
R.roadblock={name:'County Road East',cl:'hub',
 d:()=>{const n=spokes();const v=['Vines lie across the county road like somebody dropped a green hose. A cruiser is parked sideways beyond them, lights off.','The vines across the road are ankle-deep now and lacing together. The cruiser beyond them hasn\'t moved.','The road east is a hedge. Green, waist-high, slowly breathing. You can just see the cruiser\'s roof.','The road east is gone. There is only green, higher than your head, and somewhere inside it a cruiser, and inside that, Deputy Pruitt, waiting.'][Math.min(n,3)];
   return v+' This is the way Scully would come.'},
 chars:['pruitt'],look:{vines:()=>'Thick, green, warm-looking. You reach a hand out and then, wisely, put it in your pocket.',cruiser:'Deputy Pruitt, seated, hands at ten and two, engine off, going nowhere.'},
 use:{vines:()=>root('You touch the vines. They\'re warm. It\'s a nice temperature. You stand there for a while enjoying it before you notice you are.')},
 exits:{north:'parkinglot'}};

R.townhall={name:'Town Hall — Historical Society',cl:'main',car:true,
 d:()=>{const n=spokes();return `A glass case of arrowheads and a wall of framed photographs. ${here('ada')?'Miss Ada Lindqvist sits at a card table under':'A card table with nobody at it, under'} a mural that somebody painted over in the fifties. ${S.f.mural?'The mural is uncovered now: a burning field, a man in the smoke, a bell, and a sky full of birds.':'Beige. Very beige.'} Through the double doors, the meeting room: ${['empty.','a few folding chairs.','rows of chairs, half set up.','rows and rows of chairs, all set up, all facing the window.'][Math.min(n,3)]}${has('photograph')?'':' A {PHOTOGRAPH} in the case is labeled "1934 — Green Winter."'}`},
 chars:['ada'],items:['photograph'],
 look:{mural:()=>{S.f.lookedMural=!S.f.mural;return S.f.mural?'A burning field. A man standing in the smoke with his arms at his sides — not fleeing. Behind him, someone hauling a bell rope. And above everything, painted with real care: crows. Hundreds of them. Whoever painted this thought the birds were the point.':'Under the beige you can make out shapes. A field. Smoke. Something in the sky, lots of somethings. You\'d need a solvent to see it.'},chairs:'Folding chairs. The kind that pinch. Every one of them turned toward the window that faces the farm.',case:()=>has('photograph')?'Arrowheads. A jar of 1934 seed corn, gray as a tooth.':'Arrowheads, a jar of 1934 seed corn, and a {PHOTOGRAPH}.',corn:'Ninety-year-old seed corn in a jar. Dead as a doornail. A crow wouldn\'t touch it, and you\'re not sure why you thought that.'},
 use:{mural:i=>i==='solvent'?(S.f.mural=true,'You daub the stripper on and the beige comes away in wet curls. Ada doesn\'t stop you. She watches. Under the paint: a field on fire, a man standing in the smoke, arms at his sides. A second man hauling a bell rope. And the whole sky above them, painted with enormous care, black with birds.\n\n"There," Ada says quietly. "Now you know as much as I do."'):null,corn:i=>i==='seeds'?'You try to interest the corn in your seeds. This is not how anything works.':null},
 exits:{east:'nave'}};
R.nave={name:'First Congregational — Nave',cl:'main',
 d:()=>`Pews, hymnals, a window that faces the wrong way for the light. ${here('halvorsen')?'Pastor Halvorsen is at the pulpit, though there\'s nobody in the pews, rehearsing. "—and the Garden returns to us, not we to the Garden, and the Mother of the Garden asks only that we sit—" He sees you and beams. "Sit anywhere."':'The pulpit is empty. His notes are still on it.'}`,
 chars:['halvorsen'],look:{pews:'Empty. Inviting. You stay standing.',window:'Faces the farm. Everything in this town faces the farm.',pulpit:'His notes say "GARDEN," then "the MOTHER," then, underlined twice, "we don\'t have to do anything."'},
 use:{pews:()=>root(!here('halvorsen')?'You sit for a second. Just a second. The pew is warm from nothing and the church is empty. You get up faster than you sat down.':'You sit for a second. Just a second. The pew is warm from nothing. Halvorsen nods approvingly. You get up faster than you sat down.')},
 exits:{west:'townhall',north:'vestry',up:'steeple'}};
R.vestry={name:'Vestry',cl:'main',
 d:()=>`Robes on hooks, a kettle, and a hole in the ceiling where a bell rope used to run. ${S.f.bellRung?'A rope hangs down through the hole now, still swinging a little.':has('rope')?'The nail beside it is empty now.':'The {ROPE} itself hangs coiled on a nail beside the hole, dusty, taken down a long time ago and never put back.'} ${has('lighter')?'':'On the table, a dented {LIGHTER}, a pack of cigarettes, and a note in the pastor\'s hand: "Don\'t need these anymore. Take them if you do."'}`,
 items:['rope','lighter'],look:{kettle:'Cold.',note:'"Don\'t need these anymore." Three exclamation points crossed out, like he\'d thought better of the enthusiasm.',hole:'Goes straight up to the bell. Somebody took the rope down and never rethreaded it. Deliberately, you\'d guess.',nail:'Ninety years of dust in the shape of a coil.'},
 exits:{south:'nave'}};
R.steeple={name:'Steeple',cl:'main',signal:true,
 d:()=>`Wind, and the whole town laid out under you like a board game. ${S.f.bellRung?'The bell hangs silent, the rope you threaded still swinging. The rafters are empty.':'The rafters are black with crows, asleep or pretending. The bell hangs over you on its wheel, an iron hook where the rope should be.'} Your phone finds two bars up here and clings to them.`,
 look:{crows:()=>S.f.bellRung?'Gone. All of them, into the dark.':'Dozens. Hundreds. Tucked into every beam. One opens an eye at you and closes it again. Not interested. Yet.',bell:()=>'Cast in 1911, says the rim. "RING FOR FIRE, RING FOR FLOOD, RING FOR WHAT COMES." '+(S.f.bellRung?'Rung.':'No rope on it. Someone made sure of that.')},
 use:{bell:i=>{if(i!=='rope')return null;return ringBell()}},
 exits:{down:'nave'}};

R.waiting={name:'Clinic — Waiting Room',cl:'clinic',car:true,
 d:()=>`Four chairs, a fish tank${here('doc')?', and Doc Amory holding a chart the way you\'d hold a crossword with no answers. "He\'s fine," he says before you ask. "That\'s the problem. He\'s never been better."':', and the lights off. Doc\'s coat is gone from the hook.'}`,
 chars:['doc'],look:{fish:'One fish. Not moving. Breathing.',chart:'Cal Rasmussen. BP textbook. Pulse textbook. Under NOTES: "pt. requests window remain open — accommodated."'},
 exits:{north:'exam',east:'backlot'}};
R.exam={name:'Exam Room',cl:'clinic',
 d:()=>!here('cal')?`Empty. The bed is made. The window is open. On the pillow, a single green leaf, curled like a hand.`:`Cal Rasmussen sits on the paper-covered bed in his county polo, boots off, hands folded. The window is open all the way. He looks like a man on the good side of a long vacation. "Agent Mulder," he says, warmly, like he\'s been expecting you. He probably has.`,
 chars:['cal'],look:{window:'Wide open. The night breathes in. It smells like soybeans and something sweeter under that.',cal:'Calm. Tan. His eyes are the wrong kind of clear.',leaf:'You don\'t touch it.'},
 exits:{south:'waiting'}};
R.backlot={name:'Clinic — Back Lot',cl:'clinic',
 d:()=>`A dumpster, a bike nobody\'s locked, and the water tower rising over the fence with a service ladder anybody could climb. Anybody with a badge, at least.`,
 look:{ladder:'Goes up. Probably gets bars up there.',bike:'Unlocked.'},
 exits:{west:'waiting',up:'watertower'}};
R.watertower={name:'Water Tower',cl:'clinic',signal:true,
 d:()=>`Sixty feet up, BELLWETHER in flaking paint across the tank. Two bars. From here the farm is a dark square with a darker circle in the middle of it, and the circle is bigger than it was in the Gazette photo.`,
 look:{farm:'A dark circle in a dark field. Something in the middle of it catches the moonlight. Something wet.',town:'Porch lights. All on. All the windows open.'},
 exits:{down:'backlot'}};

R.greenhouse={name:'Ochieng Greenhouse',cl:'edge',car:true,onEnter:()=>{S.f.ochiengMet=true},
 use:{ochieng:i=>i==='sample'?giveSample():i==='soilkit'?'"Dirt? Agent, I have dirt. I have a whole shed of dirt." She waves it off. "A live pod off the fence. Gloved. That\'s what I\'m short."':null,'mrs':i=>i==='sample'?giveSample():null},
 d:()=>`Humid, green, alive in the normal way. Mrs. Ochieng, retired botanist, reading glasses on a chain, has three pods in three jars on her bench and is taking notes on all of them at once. "Agent! Don\'t touch the middle one, it\'s in a mood."`,
 chars:['ochieng'],look:{jars:'Three pods. One closed. One half-open and leaning toward the lamp. One grey and crusted, dead, in a jar labeled BRINE 3%. The label under it says "see notes."',notes:'"Phototropic — strong. Thermotropic — stronger. Seed mass enormous. Corvid interest: high, unaffected. Corvid PREFERENCE: sunflower, by a mile — they only eat these when there\'s nothing better. Sample 3: 3% brine bath — dead in fifty minutes, grey, crystallized at the seams. Sample 2: fresh water — thriving. NB: what is the vector?"'},
 exits:{east:'shed',north:'elevator'}};
R.shed={name:'Potting Shed',cl:'edge',
 d:()=>`Terra cotta, bags of perlite${has('soilkit')?', and an empty spot on the bench where the soil kit was':', and a county extension {SOIL KIT} somebody left on the bench'}. Out the back, a public works truck is parked with its tailgate down and a pallet of ${has('salt')?'road salt sacks, one short':'{ROAD SALT} sacks'}, waiting for a winter that\'s months away.`,
 items:['soilkit','salt'],look:{truck:'Public works. Keys in it.',perlite:'Perlite.'},
 exits:{west:'greenhouse'}};
R.elevator={name:'Grain Elevator — Base',cl:'edge',
 d:()=>`The tallest thing for twenty miles. A rusted ladder runs straight up the north face to the catwalk. ${S.f.vinesCleared?'The ladder is clear — rungs scarred green where the crows worked. The crows are still here, on the wire, keeping the seeds.':'The ladder is wrapped, rung over rung, in green vines thick as a wrist. They move if you watch long enough. They\'re warm.'}${has('crowbar')?'':' A {CROWBAR} lies half-buried in gravel by the loading dock.'} Three crows sit on the wire overhead, watching you with professional interest.`,
 items:['crowbar'],look:{crows:'They aren\'t afraid of the vines. They aren\'t afraid of you either. All three of them are looking directly at your jacket pocket.',vines:()=>S.f.vinesCleared?'Torn back from the ladder, sulking in the gravel.':'Warm. Slow. Rung over rung. If you grabbed one it\'d feel nice, and you know that, and that\'s the whole problem.',ladder:()=>S.f.vinesCleared?'Clear. Go up.':'Blocked, unless you\'ve got a plan for the vines.'},
 use:{vines:i=>{if(S.f.vinesCleared)return 'They\'ve had enough of crows for one night.';
    if(i==='crowbar')return root('You wedge it in and pry. The vine gives, slowly, like it\'s letting you. Your knuckles brush the green. It\'s warm. It\'s — nice, actually. You\'ve been standing here a while.\n\nYou drop the crowbar and pick it up again. Your hand is annoyed at you.');
    if(i==='seeds'){if(S.seeds<=0)return 'The pouch is empty.';if(S.seeds<12){S.seeds--;ui();return 'You tuck '+(S.seeds===0?'your one seed':'a seed')+' into the coils. One crow drops, takes it, and goes back to the wire. The vines don\'t care. It\'ll take a real dozen to make it worth a fight.'}S.f.vinesCleared=true;S.seeds-=12;return 'You tuck a dozen sunflower seeds into the coils.\n\nNothing. Then one crow drops. Then all three, then more from somewhere, and they go after the seeds with the focus of a bomb squad. The vines are in the way. Green comes off in beakfuls. The vines flinch back from the ladder like they\'ve been burned.\n\nThe rungs are clear. The crows keep the seeds. One of the torn vines is still moving, slowly, in the gravel.'}
    if(i==='lighter')return 'You flick the lighter near a vine. It doesn\'t care. Something a mile away, in the field, does — you feel it like a change in air pressure. You put the lighter away.';
    if(i==='salt')return 'You scatter a handful. The vine you hit goes gray and still. The rest don\'t. Forty pounds of salt, forty feet of ladder. Bad math.';
    return null},
   crows:i=>i==='seeds'?(S.seeds>0?'You hold out a seed. A crow takes it, politely, and goes back to the wire. That was nice. It didn\'t clear the ladder.':'The pouch is empty.'):null},
 exits:{south:'greenhouse',up:()=>S.f.vinesCleared?'catwalk':'The ladder is wrapped in vines. Something needs to move them.'}};
R.catwalk={name:'Grain Elevator — Catwalk',cl:'edge',signal:true,
 d:()=>`The whole map from up here: the motel\'s one light, the steeple, the water tower, and the farm — a dark square with a wet circle in the middle. Full bars. The last full bars in Bellwether, you\'d bet.`,
 look:{farm:'The circle in the field has a shape now. Petals? Doors?',town:'Every porch light on. Not one car moving.'},
 exits:{down:'elevator'}};

R.farmhouse={name:'Halloran Farmhouse',cl:'farm',car:true,
 d:()=>`${here('hallorans')?'The Hallorans at their kitchen table, a pot of tea between them gone stone cold, both smiling at nothing in particular. The back door is open.':'The kitchen table, two cups of cold tea, two chairs pushed back. The back door is open.'} A whole wall of family photos goes back a hundred years.`,
 chars:['hallorans'],look:{photos:()=>{S.f.lookedPhotos=true;return 'Weddings, tractors, a county fair. And one from 1934: a young man in a work shirt with the Rasmussen jaw, standing next to a field, arms at his sides. The caption says "Uncle Emil — Green Winter." Cal\'s grandfather. Everybody in this town is related to the last time.'},tea:'Cold. Two cups, full.',door:'Open onto the field. The smell comes in sweet.'},
 exits:{east:'field'}};
R.field={name:'Soybean Field',cl:'farm',
 d:()=>{if(S.turned)return '';return `Rows of soybeans, then rows of something else, and then the ground changes under your shoes: scorched, gray, damp. This is the crater\'s outer edge — the blast ring, where the meteorite\'s heat reached before it stopped. The crater itself is thirty feet north, past a hedge of vines across the path, hedge-thick and utterly still. You can see it from here. You can stand on the edge of it. You can\'t get in. Along the fence line, crows — dozens — working at pods that have grown along the wire, pulling seeds out and eating them. Nothing else is alive out here. No deer. No dogs. Just birds.${has('sample')?' There\'s a gap on the wire where you bagged one. The crows have not forgiven you.':' One {POD} on the fence wire is close enough to bag, if you had gloves and a bad idea.'}`},
 look:{crows:()=>{S.f.lookedCrows=true;return 'They\'re pulling seeds out of the pods and eating them, without much joy — the way you eat airport food. The pods don\'t seem to mind. The pods don\'t seem to notice at all. Whatever\'s in the air out here, the crows are breathing it and shrugging. One of them is watching your jacket pocket instead of the pod in front of it.'},pods:()=>'Fat, pale, split along one seam. Warm-looking. Nothing on Earth grows like that and you\'d know, you\'ve read the books.'+(has('sample')?'':' One on the wire is close enough to take.'),path:()=>{S.f.triedCrater=true;return 'Vines across it, tight as a hedge, still as a wall. Not moving. Not for you — not yet. Whatever\'s out there is waiting for something, and it isn\'t you.'},crater:()=>{S.craterLooks++;const t=['Past the vines: a circle of scorched dirt, and in the middle, something the size of a washing machine, glistening. Bigger than the Gazette photo.','The thing in the crater is the size of a car now. You didn\'t imagine that.','It\'s bigger than a car. It\'s split open along the top, and there\'s a warm light inside it, and you could swear it\'s facing you.'];return t[Math.min(S.craterLooks-1,2)]},soil:'Scorched, gray, damp where nothing\'s been watered. The crater\'s edge, under your shoes. A soil kit would tell you what kind of wrong.',ground:()=>R.field.look.soil,dirt:()=>R.field.look.soil,edge:()=>R.field.look.soil,ring:()=>R.field.look.soil},
 use:{ground:i=>i==='soilkit'?soil():null,dirt:i=>i==='soilkit'?soil():null,edge:i=>i==='soilkit'?soil():null,ring:i=>i==='soilkit'?soil():null,crows:i=>i==='seeds'?(S.seeds>1?(S.seeds--,S.f.crowsPrefer=true,'You flick one sunflower seed onto the fence rail. Every crow on the wire abandons its pod mid-bite. Six of them land on the rail. The winner takes the seed; the other five look at you like you\'ve been holding out. The pods sit there, ignored, sweating.'):'You\'re down to your last one. They can tell.'):null,crater:i=>i==='soilkit'?soil():null,soil:i=>i==='soilkit'?soil():null,path:i=>i==='lighter'?'You could. You feel a mile of vine feel you think it. You put it away. Not yet.':i==='salt'?'A handful. One vine grays out. The hedge closes the gap.':null,vines:i=>i==='crowbar'?root('You pry at the hedge. It lets you get your hands deep in before you notice you\'ve stopped pulling.'):null},
 take:{pod:()=>{if(has('sample'))return 'One\'s plenty. It\'s warm through the bag and you don\'t love that.';give('sample');return 'You reach for the nearest pod barehanded. Your hand really, really wants to. You go back to the car for the gloves first, and a freezer bag, and you bag one pod off the wire while the crows watch you like you\'re stealing from their fridge. Warm through the plastic.'}},
 exits:{west:'farmhouse',east:'truck',north:()=>{S.f.triedCrater=true;return 'The vines across the path are thick as a hedge and completely still. Whatever\'s out there isn\'t ready for you yet. That\'s the wrong way round, and you know it.'}}};
R.truck={name:'Cal\'s Truck',cl:'farm',
 d:()=>`A county pickup nosed up to the edge of the crater path, engine still running after four days, radio murmuring a farm report to nobody. The headlights are off. The tank\'s near empty.`,
 look:{radio:'"—soybean futures steady, and folks, that\'s the weather. Stay put, it\'s a nice night." It\'s been saying that for a while.',headlights:()=>has('keys')?'Off. Pointed at the hedge, and past it, the crater.':'Off. You\'d need the keys to run them without killing the engine, and Cal has those.',crater:'From here you can see it breathing.'},
 use:{truck:i=>i==='keys'?trucktest():null,headlights:i=>i==='keys'?trucktest():null},
 exits:{west:'field'}};
R.crater={name:'The Crater',cl:'farm',
 d:()=>{const F=S.fight;if(S.f.craterSeen)return craterNow();S.f.craterSeen=true;return `The scorched circle where the meteorite came down. And in the middle of it, what came down inside the meteorite, four days grown.\n\nA plant. That\'s the only word for it and it\'s the wrong word. The size of a car, pale green shading to something that isn\'t a color, split open along the top like a seed case and breathing — you can see it breathe. Vines the thickness of your arm run out from her base in every direction, under the rows, under the town, under the road east. Every green thing that\'s choked Bellwether this week starts here. She is the thing that came from space. She is what the town has been walking toward.\n\nSeated inside the split, comfortable, hands folded, eyes open: Cal Rasmussen. When she wants to speak, she uses him. "You made it," he says, and smiles, and the smile isn\'t his. "We saved you a seat. Front row. The pods open at first light and then it\'s over and everyone can rest. You have until dawn to sit down. Come and meet the Mother."\n\nThat\'s what the town calls her. You heard it in the pews. You\'re going to call her that too, because the alternative is screaming.\n\nPods the size of pumpkins hang off her flanks${F.light?', split and spilling in the headlight glare':', sealed, sweating, ripening'}.${F.proof===1?' One of them has a crowbar-sized bite in its seam. Half done.':F.proof>=2?(F.light?' One of them is broken open with its neighbours peeled back around it — a ledge.':' One of them is broken open, a narrow slot hemmed in by sealed pods.'):''} ${F.right>=3?'The vines she was holding up over herself lie in the dirt around her, slack. The air above her is open. ':'Over her, a dozen vines stand up out of the split and sway in the air, slow, like kelp — no. Like a hand waving off flies. '+vineState()+' '}${F.light?'':'At the rim, Cal\'s truck idles where he left it four days ago, nose toward her, headlights dark. '}${F.light?'Around the rim, the town is on its feet, turned toward the headlights, swaying.':'Around the rim, the town, seated in rows in the dark, patient, facing her.'}${F.stood.length?' '+F.stood.join(', ')+(F.stood.length>1?' have':' has')+' stepped out of the line toward you.':''} ${S.f.bellRung?'Overhead, the sky is moving. Wings.':'Overhead, nothing. The crows are asleep in the steeple.'}\n\nThe path closed behind you. There is no way out.`},
 chars:['mother'],
 look:{vine:()=>R.crater.look.vines,plant:()=>R.crater.look.mother,her:()=>R.crater.look.mother,alien:()=>R.crater.look.mother,cal:'He\'s the mouth. When she talks his lips move a half-second late, like a dub.',pods:()=>(S.fight.proof===1?'The one you started on is gaping a quarter inch. Another heave with the bar and it goes. ':S.fight.proof>=2?(S.fight.light?'One\'s broken open and the ones around it have peeled back: a ledge, a hole, a place a bird could work. ':'One\'s broken open — a narrow slot between sealed neighbours. A hand fits. A bird wouldn\'t. '):'')+(S.fight.light?'The rest are cracked by the light, seeds fat and pale inside.':'The rest are sealed tight, pressed together like a fist. Ripe but waiting — for dawn, you figure, when everyone\'s rooted enough to carry. Or for anything bright enough to pass for it. Ochieng\'s pod turned a quarter-turn toward a space heater. Cal\'s truck is right there.'),town:()=>S.fight.light?'Denise. Pruitt. The Hallorans. Ada. Doc. All standing now, turned to the light, swaying a little.':'Denise. Pruitt. The Hallorans. Ada. Doc. All seated. All smiling. All facing her.',sky:()=>S.f.bellRung?(S.fight.right>=3?'Crows, hundreds, and nothing between them and her now. They\'re waiting for a reason.':'Crows, circling, hundreds, not landing. Every time one dips, a vine comes up to meet it. She\'s keeping the air.'):'Empty. You should have rung the bell.',vines:()=>S.fight.right>=3?'Down. All of them, slack in the dirt, twitching now and then like something dreaming. She\'s stopped holding her breath. Nothing is between you and her now but her.':'The ones standing up out of her sway like a hand waving off flies. '+vineState()+' She holds them up the way you hold your breath — as long as she\'s paying attention, nothing you\'re carrying gets near her.',truck:'Still running at the edge of the crater. Radio still murmuring.',mother:()=>'An alien plant the size of a car, split open, breathing, with a county employee sitting in it like a man in a bathtub. You\'ve waited your whole career for something this unambiguous and you can\'t even call Scully.'+(S.fight.right<3?' The vines over her sway in time with her attention — every time she\'s busy talking, they drift a little. She\'s never had to hold a conversation and a defense at the same time.':' The vines are down. She\'s stopped defending herself; she\'s only talking.')},
 use:{
   truck:i=>i==='keys'?light():null,headlights:i=>i==='keys'?light():null,
   pod:i=>i==='crowbar'?proof():i==='seeds'?seedsOnMother():null,pods:i=>i==='crowbar'?proof():null,
   mother:i=>i==='seeds'?seedsOnMother():i==='crowbar'?proof():i==='salt'?endSalt():i==='lighter'?endFire():i==='rope'?('You\'re holding a rope. The bell is a mile away in the steeple, hookless, silent. You should have put it back before you followed them in.'):null,
   field:i=>i==='lighter'?endFire():i==='salt'?endSalt():null,
   cal:i=>i==='seeds'?seedsOnMother():null,
   plant:i=>R.crater.use.mother(i),her:i=>R.crater.use.mother(i),it:i=>R.crater.use.mother(i),alien:i=>R.crater.use.mother(i),'seed case':i=>R.crater.use.mother(i),
 },
 exits:{}};

/* ===================== CHARACTERS ===================== */
function root(t){S.rooted++;ui();const w=['\n\n(Something inside you sat down a little.)','\n\n(You notice you\'re smiling. You stop. Your hand has gone to the seed pouch on its own.)','\n\n(How long were you standing there? Your mouth wants salt. Something sharp. Something that\'s yours.)'][Math.min(S.rooted-1,2)];
  if(S.rooted>=4){say(t);endSeated();return ''}return t+w}
const C={
 denise:{n:'Denise',talk:()=>{const v=(S.visits.office||1);const g=[
   '"Cal Rasmussen? Sweetheart, everybody knows Cal. Went out to the Hallorans\' and just — didn\'t feel like driving back, I guess. Doc\'s got him. He\'s FINE. He\'s more than fine." She laughs. "Wish I could catch whatever he\'s got."',
   '"You know, I used to hate this job. Nights, the buzzer, the ice machine. Tonight I just don\'t mind." She looks at the window. "Everybody\'s going out to the meeting later. You should come."',
   '"It\'s nice out."','"It\'s nice."'];
   return [
   ['Ask about Cal Rasmussen',()=>g[Math.min(v-1,3)]],
   ['Ask about the meeting',()=>spokes()>=3?'"Eight o\'clock. Town hall. Then we all walk out together." She says it like a hymn.':'"Town meeting, eight sharp. About the — you know." She waves toward the farm. "Pastor\'s speaking. Everybody\'s going. Everybody."'],
   ['Sit down a minute',()=>root('You sit on the lobby couch. Denise smiles. The couch is very comfortable. You are up before you decide to be.')]]}},
 pruitt:{n:'Deputy Pruitt',talk:()=>[
   ['Ask what he\'s doing',()=>'"Waiting on backup, sir." He doesn\'t turn his head. "County said they\'d send a unit. That was Sunday." He smiles at the windshield. "Nice night for it."'],
   ['Ask about the road',()=>'"Grows over some nights. Grows back. Your partner\'s coming this way?" He nods, slow. "She\'ll be fine. Everybody\'s fine."'],
   ['Sit in the cruiser with him',()=>root('You get in the passenger side. The seat\'s warm. The radio\'s playing something without words. You watch the vines for a while. Then you get out, and it takes more than it should.')]]},
 ada:{n:'Miss Ada',talk:()=>[
   ['Ask about the meteorite',()=>'"Oh, it\'s in the paper. Came down last Thursday. Made a lovely noise." She adjusts a stack of index cards that doesn\'t need it. "Nice for the tourism."'],
   ['Ask about 1934',()=>S.f.mural?(S.f.adaDone=true,S.f.bellKnown=true,'She looks at the mural for a long time.\n\n"The Green Winter. It came down like this one did. Grew like this one did. Everyone got so — pleasant." She folds her hands. "They burned the field. But you can\'t just burn it — the seed goes up in the smoke and it needs somewhere to land, and if you give it nowhere it takes everywhere. Every field for fifty miles. Unless it has somewhere it already knows." She looks at the man in the painted smoke. "Emil Rasmussen was the first one to sit down that winter. He was hers before anyone. The smoke didn\'t land on him, Agent Mulder — it went home to him. All of it. Then he walked east with it, out of town, and kept walking until it was finished with him. They found him in April. My grandfather rang the bell." She taps the painting, the sky. "Nobody ever said why the bell. Everyone remembered the fire. Nobody remembered the birds. I think they were the point, Agent Mulder. I think the birds were the whole point."\n\nShe smiles. "I\'m going to the meeting now."'):(S.f.adaVague=true,'"The Green Winter." She smiles the way you\'d smile at a dentist. "It was a hard year. We don\'t talk about it much." She looks, involuntarily, at the mural. "Someone painted over the — well. It was a hard year."')],
   ['Ask about the photograph',()=>'"Emil Rasmussen and my grandfather. That\'s the field. That\'s the fire." She pauses. "That\'s the rope."']]},
 halvorsen:{n:'Pastor Halvorsen',talk:()=>[
   ['Ask about the sermon',()=>'"The Garden!" He\'s delighted. "And the Mother in it — that\'s what Cal called her, when he came by. It stuck." "We spend our whole lives trying to get back in, and here it comes to us. All we have to do is sit down." He isn\'t possessed. You almost wish he were. "You should sit down."'],
   ['Ask about the bell',()=>'"1911. Hasn\'t rung since before my time — somebody took the rope down after the Green Winter and hung it on a nail, and nobody ever put it back." He glances up. "There\'s a note in the vestry ledger — ring for what comes. I always liked that. Nothing came, you know? Until now."'],
   ['Sit down in the pews',()=>root('You sit. He nods like a man watching a plant take. "There," he says. You get up. It\'s an effort.')]]},
 doc:{n:'Doc Amory',talk:()=>[
   ['Ask about Cal',()=>'"Perfect vitals. Perfect. Hasn\'t eaten in four days and his numbers look better than mine." He rubs his face. "He asked me to keep the window open. I did. And then I kept mine open at home. And it\'s — it\'s nice? Is that a symptom?"'],
   ['Ask about the window',()=>{S.f.docDone=true;return '"He said the air was better. And it is." Doc looks at his own hands. "Mine\'s stuck open now. I don\'t really mind." He says it like he\'s telling you a diagnosis. Maybe he is.'}],
   ['Ask about the town',()=>'"Blood pressure\'s down across the board. Nobody\'s come in with anything in three days. I should be thrilled." He isn\'t.']]},
 cal:{n:'Cal Rasmussen',talk:()=>{return[
   ['Ask what happened in the field',()=>'"I got out of the truck," he says, "and I looked at it, and I thought — I don\'t have to do the reports." He laughs, easy. "Twelve years of reports, Agent Mulder. I just sat down. It was the best idea I\'ve ever had."'],
   ['Ask about his truck',()=>{if(has('keys'))return '"Still running?" He nods, pleased. "Good truck."';give('keys');return '"Truck? Oh — still out there, still running, probably. Here." He unhooks the {KEYS} from his belt and holds them out without looking at them. "I don\'t think I\'ll be needing them." He says it like he\'s passing the salt.'}],
   ['Ask about his grandfather',()=>'"Emil." His face does something warm. "I never met him. Died in \'34. But I\'ve been — remembering him, this week. Isn\'t that strange? Standing in a field with his arms down. Like he\'d decided something." He smiles at the open window. "I think he was happy."'],
   ['Sit down next to him',()=>root('You sit on the edge of the paper bed. He shifts to make room. The window breathes on the back of your neck and you think: this is fine. Then you think: get up. It takes two tries.')]]}},
 ochieng:{n:'Mrs. Ochieng',talk:()=>{const o=[
   ['Ask what she\'s found',()=>{const t='"Phototropic, thermotropic, and I mean STRONGLY — the middle one turned a full quarter toward the space heater in ten minutes. Seed mass is absurd. Every crow in the county will eat them and not one crow is acting funny — though I put out a dish of sunflower seed next to the jars and they didn\'t look at the pods again all afternoon." She taps the jar. "Whatever this does to people, it doesn\'t do to birds. Don\'t ask me why. Ask me tomorrow. Don\'t try opening one with your hands — they don\'t open for hands, I had to use a chisel. And don\'t give one a bath: I salted the third jar to see what would happen and it was dead in an hour."';S.f.chiselKnown=true;S.f.saltKnown=true;return t}],
   ['Ask about the meeting',()=>'"Oh, I\'m not going." She says it like it\'s obvious. "I\'ve got work. First person in ninety years who\'s got something interesting to do in this town and they want me to sit in a chair." She snorts. "Tell you the truth, Agent, I don\'t think I could sit still if I tried."']];
   if(has('sample'))o.push(['Offer her the pod',()=>giveSample()]);
   else o.push(['Ask what she needs',()=>'"A live one off the fence, gloved, if you\'re out there. Mine are all from one vine. I want to see if they argue."']);
   return o}},
};
function giveSample(){if(!has('sample'))return null;drop('sample');give('solvent');return '"Oh, you GLOVED it. Bless you." She takes the bag like it\'s a kitten. "Mine are all off one vine. I need a fence one." She sets it by the others, and then looks at you differently. '+(S.visits.townhall?'"You\'ve been to the town hall? You\'ve seen the beige." You have. ':'"When you go by the town hall — and you will — look at the big beige wall behind Ada\'s table. ')+'"There\'s a mural under that. My mother helped paint it, 1935. She said it was the birds — the whole point was the birds — and the council covered it in \'52 because it frightened the children." She rummages under the bench and comes up with a brown bottle. {SOLVENT}. "I\'ve been trying to get Ada to let me strip it for twenty years. She won\'t. She might not stop a federal agent." She pushes it into your hands. "Tell me what\'s under there."'}
Object.assign(C,{
 hallorans:{n:'the Hallorans',talk:()=>[
   ['Ask about the crater',()=>'"Made a heck of a noise," Mr. Halloran says. "Then it didn\'t." Mrs. Halloran pours you a cup of cold tea you didn\'t ask for. "You should see it up close. Everyone should."'],
   ['Ask about Cal',()=>'"Cal\'s family," Mrs. Halloran says. "His grandpa\'s on the wall there." She smiles at the wall. "Good people, the Rasmussens. Always knew when to stop."'],
   ['Sit down with them',()=>root('You sit. The tea is cold and you drink it anyway. The three of you look at the open door for a while. Getting up feels rude, and then it feels hard.')]]},
 mother:{n:'the Mother',talk:()=>fightOptions()},
});

/* ===================== SPECIALS ===================== */
const GONE={ada:'main',halvorsen:'main',cal:'clinic',doc:'clinic',hallorans:'farm',denise:'ready'};
function gone(c){const k=GONE[c];if(!k)return false;if(k==='ready')return S.ready&&S._left.ready;return S.closed[k]&&S._left[k]}
function present(r){return (r.chars||[]).filter(c=>!gone(c))}
function here(c){return !gone(c)}
function leaveRoom(){for(const k in S._closeRoom)if(S._closeRoom[k]===S.room&&!S._left[k]){S._left[k]=true;if(S._notes[k]){sys(S._notes[k]);delete S._notes[k]}}}
function soil(){if(S.f.soilRead)return 'You\'ve got the reading. Nobody\'s going to believe it until Scully does.';S.f.soilRead=true;return 'You crouch and run the kit on the scorched ground at your feet — the crater\'s edge. pH: fine. Nitrogen: fine. The salinity strip goes a color past the end of the laminated chart. You run it again. Same color. You hold the strip against the chart and there is nowhere to put it. You fold it into your notebook. Somebody who knows what this means would help. Somebody who\'s driving. Somebody you\'d need bars to reach.'}
function ringBell(){if(S.f.bellRung)return 'It\'s rung. It\'s still ringing, somewhere in your teeth.';if(!has('rope'))return null;
  S.f.bellRung=true;drop('rope');let t='You thread the rope through the hook, drop it through the hole to the vestry floor, and haul. The bell hasn\'t rung at night since 1934 and it sounds like it knows that — one enormous bronze note that goes out over the town and doesn\'t come back.\n\nThe rafters explode. Every crow in the steeple, every crow in Bellwether, up and out into the dark in one black wave, wheeling, screaming, circling the town like a question.';
  if(!S.f.bellKnown)t+='\n\nYou\'re not entirely sure why you did that. It felt right. Ada would know.';return t}
function craterNow(){const F=S.fight;const p=[];
  p.push(F.light?'Headlights across the crater. The pods have unfolded flat against her flank, seed showing pale in the glare'+(F.proof>=2?', and where you pried one there\'s a ledge now, a hole with a lip a bird could work.':'.'):'The pods hang sealed off her flanks, pressed tight, sweating'+(F.proof===1?'. One has a crowbar bite in its seam — half done.':F.proof>=2?'. One is broken open, a narrow slot hemmed in by its sealed neighbours.':'.'));
  p.push(F.right>=3?'Her vines lie slack in the dirt. The air above her is open.':'Her vines stand up out of the split and sway. '+vineState());

function doSalt(){endScreen('THE SALT ENDING.',['You keep going. Armful after armful, and she grays where it lands, and grays, and grays, and the vines under the town go gray with her, and Cal\'s mouth says "oh" once more and then nothing. His eyes stay open.','It takes an hour. Your arms stop working before the sack runs out.','The town wakes slowly, cold, stiff, embarrassed. Everyone\'s fine. Everyone keeps saying so.','Cal walks home. He\'s fine. He keeps his window open. He keeps it open the rest of his life, and every now and then, mid-sentence, he stops and looks at it, and doesn\'t finish.','Headlights on the ridge at four. Scully gets out into a gray field that crunches. You don\'t have a good answer for her.','Everyone survived. Nobody says that like it\'s the whole story.'])}

function doFire(){endScreen('THE 1934 ENDING.',['You touch the flame to the nearest vine. It goes up like it was waiting to, and the fire runs the vine like a fuse — under the rows, under the fence, out toward the road, a bright map of everywhere she\'s been.','The pods go last, and loudest. The spores go up with them: a warm, sweet cloud, rising, looking for a place to land.','Cal stands. Arms at his sides. He walks into the smoke the way his grandfather did, unhurried, and the cloud finds him — you watch it find him, the whole sweet weight of it settling on one man instead of a county — and you shout his name, and he turns and gives you a little wave like a man leaving a party, and you let him, because you can\'t think of anything else, and he\'s smiling, and that\'s the worst part.','He walks out the far side of the smoke and keeps walking, east, into the dark past the road. Nobody stops him. Everybody who could has just woken up.','The town wakes up in the firelight, one by one, coughing, embarrassed. Denise asks what time it is. Pruitt asks where his hat is. The Hallorans hold each other and don\'t know why.','The road east is ash by four a.m. Headlights on the ridge. Scully gets out into a burning field and looks at you and looks at the field and looks at you.','"Mulder. Where\'s the extension agent."','You point east. You say his name. You say "April," and you can\'t explain the rest.','Somebody paints over this one, too.'])}

    case 'HINT':hint();break;
    case 'HELP':say('LOOK · GO [n/s/e/w/up/down] · TAKE [ITEM] · USE [ITEM] ON [thing] · TALK [person] · CALL SCULLY (where there\'s signal) · INVENTORY · MAP. Things in CAPITALS can be taken. NOTES opens Mulder\'s case file; HINT nudges (twice for a straight answer). WAIT at Room 6 once the meeting starts to let the night come. SAVE gives you a code, LOAD [code] restores it, RESTART starts over, CRATER jumps back to midnight once you\'ve reached it. Opened in your own browser, the game also autosaves.','sys');break;
    default:say('That word isn\'t on the bar. The town\'s the puzzle, not the parser.','sys')}
  after()}

/* ===================== UI ===================== */
function ui(){const r=R[S.room];
  {const ch=present(r);
   const ex=Object.keys(r.exits||{});
   let s='<b>'+r.name.toUpperCase()+'</b>';
   s+='  ·  Exits: '+(ex.length?ex.map(e=>e.toUpperCase()).join(', '):'none')+(r.car&&!S.turned?' · car':'');
   if(ch.length)s+='  ·  Here: '+ch.map(c=>C[c].n).join(', ');
   if(S.ready&&!S.turned)s+='  ·  <span class="g">the meeting is in — WAIT at Room 6</span>';
   $('#statusline').innerHTML=S.ended?'<b>— END —</b>':s;}
  $('#inv').innerHTML=S.inv.map(i=>'<li>'+ITEMS[i].n+(i==='seeds'?' <small>×'+S.seeds+'</small>':'')+'</li>').join('')||'<li><small>nothing</small></li>';
  $('#seedstat').textContent='seeds '+S.seeds;
  $('#sig').textContent=S.turned?'📵 NO SERVICE':(r.signal?'📶 signal':'📵 no signal');
  const clock=$('#clock');clock.textContent=S.turned?'12:00 AM — the field':['4:10 PM','6:25 PM','7:40 PM','7:58 PM — the meeting','8:00 PM — the meeting'][spokes()];
  const m=$('#map');m.className=S.turned?'grey':'';
  m.innerHTML=Object.keys(CL).map(cl=>{const rooms=Object.keys(R).filter(k=>R[k].cl===cl);const canDrive=!S.turned&&r.cl!==cl;
    return '<div class="cl"><span class="n '+(r.cl===cl?'here':'')+(canDrive?' drive':'')+'" data-cl="'+cl+'">'+CL[cl]+(S.closed[cl]?' ✓':'')+'</span><div class="rooms">'+rooms.map(k=>'<span class="'+(k===S.room?'here':(k==='crater'&&!S.turned?'locked':''))+'">'+(k==='crater'&&!S.turned?'▒▒▒▒':R[k].name.replace(/^.*— /,''))+'</span>').join(' · ')+'</div></div>'}).join('');
  m.querySelectorAll('.drive').forEach(el=>el.addEventListener('click',()=>{say('drive to '+CL[el.dataset.cl],'you');drive(el.dataset.cl);after()}));
  const rt=$('#rooted');rt.style.display='block';rt.querySelector('.lbl').textContent='Rooted';rt.querySelectorAll('i').forEach((b,i)=>b.classList.toggle('on',i<S.rooted));
  document.querySelector('[data-v="CALL SCULLY"]').disabled=!(r.signal&&!S.turned);}
const VERBS=['LOOK','GO','DRIVE','TAKE','USE','TALK','CALL SCULLY','WAIT','NOTES','HINT','INVENTORY','MAP','HELP','RESTART'];
$('#verbs').innerHTML=VERBS.map(v=>'<button class="v" data-v="'+v+'">'+v+'</button>').join('');
document.querySelectorAll('button.v[data-v]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.v;
  if(v==='INVENTORY'||v==='MAP'||v==='CALL SCULLY'||v==='LOOK'||v==='DRIVE'||v==='WAIT'||v==='NOTES'||v==='HINT'||v==='HELP'){handle(v);input.focus();return}
  if(v==='RESTART'){input.value=v;input.focus();say('Press Enter to start over from the beginning.','sys');return}
  input.value=v+' ';input.focus()}));
input.addEventListener('keydown',e=>{if(e.key==='Enter'){if(typing){skip=true;}const v=input.value;input.value='';handle(v)}});
$('#restart').addEventListener('click',()=>start(true));$('#crater').addEventListener('click',backToCrater);

function start(forceNew){log.innerHTML='';anchorY=null;log.scrollTop=0;$('#restart').style.display='none';$('#crater').style.display='none';input.disabled=false;queue=[];skip=false;
  if(!forceNew){let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
    if(saved){try{loadSnap(saved);sys('(Resumed. Type RESTART to begin again.)');ui();if(S._replayTurn){S._replayTurn=false;theTurn()}else look();input.focus();return}catch(e){}}}
  S=fresh();checkpoint=null;try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'.crater')}catch(e){}
  say('BELLWETHER, OREGON. POP. 1,200.','title');
  cut('You are Fox Mulder.');
  cut('Last Thursday, a meteorite came down in the Hallorans\' soybean field. The Gazette ran a cute story. Friday, county extension agent Cal Rasmussen drove out to look at "unusual growth" and didn\'t come home. His truck is still running.');
  cut('Scully\'s flight got grounded in Salt Lake. She\'s renting a car. "Nine hours, Mulder. Do NOT touch anything."');
  cut('It is Tuesday. It\'s a nice night. Everyone keeps saying so.');
  sys('Things in CAPITALS can be taken. GO [direction] to walk, GO [place] to drive. NOTES for the case file. Type HELP anytime.');
  S.visits.room6=1;ui();look();input.focus()}
start();
</script>
